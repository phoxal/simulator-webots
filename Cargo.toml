[package]
name = "phoxal-simulator-webots-controller"
# The first standalone release continues above the versions this package name
# already published from the framework train (up to 0.62.1). The phoxal registry
# index is append-only, so a fresh 0.1.x would have to be written before those
# records and the publication is refused. The train and this version are
# independent from here on.
version = "0.63.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
# Executables reach robots through the static `phoxal` registry, never
# crates.io. Declaring the allowed registry in the manifest is the second,
# independent guard: a plain `cargo publish` cannot reach crates.io by accident.
publish = ["phoxal"]
description = "Phoxal official simulator: Webots per-robot component-capability controller."
documentation = "https://github.com/phoxal/simulator-webots#readme"
homepage = "https://github.com/phoxal/simulator-webots"
repository = "https://github.com/phoxal/simulator-webots"

[[bin]]
name = "phoxal-simulator-webots-controller"
path = "src/main.rs"

[dependencies]
# The controller is a plain bus client, not a participant: it depends on the
# transport, the contract catalogue, the robot model and the bundle reader, and
# deliberately not on the `phoxal` facade, whose runner, roles and setup context
# describe a supervised participant this process is not.
#
# `phoxal-runtime-contract` is deliberately absent: the runtime identities this
# binary names (`ParticipantId`, `ExecutionId`, `TimelineId`) appear in
# `phoxal-bus`'s own signatures and are re-exported from it, so naming the
# owning crate a second time would add a direct dependency that buys nothing.
phoxal-bus = "0.65"
phoxal-protocol = "0.65"
phoxal-model = "0.65"
phoxal-bundle = "0.65"
webots-rs = "0.2"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# No in-memory constructor states a component instance's `driver` block - it is
# a persisted-manifest fact - so the presence test writes one into the document
# the model itself round-trips. Nothing in the binary parses JSON.
[dev-dependencies]
serde_json = "1"

# The panic and stub rules, enforced rather than reviewed.
#
# This binary drives a simulated robot for as long as the world runs: a panic
# takes the whole simulation down mid-step and leaves the motors wherever they
# were, so a failure a caller could act on must be a typed error and not an
# `.unwrap()`. Tests are exempt through `clippy.toml`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
