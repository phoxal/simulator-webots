# Clippy's own configuration, for the two switches that are not lint levels and
# therefore cannot live in `[lints]`.
#
# `unwrap_used` and `expect_used` are denied because a panic in this process
# takes down a running simulation. A test has no such caller: when a fixture
# cannot be staged or a decode the test itself wrote fails, panicking *is* the
# report. These two switches keep the gate off test code, so no test needs a
# local `allow`.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
